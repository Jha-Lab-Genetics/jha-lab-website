<div
  class="feature"
  {% if include.dark %}
    data-dark="true"
  {% endif %}
  {% if include.flip %}
    data-flip
  {% endif %}
>
  {% if include.youtube %}
    <div class="feature-image feature-video">
      <iframe
        src="https://www.youtube-nocookie.com/embed/{{ include.youtube | uri_escape }}"
        title="{{ include.title | default: 'Video' | xml_escape }}"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </div>
  {% else %}
  <a
    {% if include.link %}
      href="{{ include.link | relative_url | uri_escape }}"
    {% endif %}
    class="feature-image"
    {% if include.contain %}
      data-contain
    {% endif %}
    aria-label="{{ include.title | default: "feature link" | regex_strip }}"
  >
    <img
      src="{{ include.image | relative_url | uri_escape }}"
      loading="lazy"
      alt="{{ include.title | default: "feature image" | regex_strip }}"
      {% include fallback.html %}
    >
  </a>
  {% endif %}
  <div class="feature-text">
    {% if include.title %}
      <p class="feature-title">{{ include.title }}</p>
    {% endif %}
    {{ include.text | markdownify }}
  </div>
</div>
